<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 525" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E26" />
      <stop offset="100%" stop-color="#0F1116" />
    </linearGradient>
    <linearGradient id="figureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C3240" />
      <stop offset="100%" stop-color="#1C202A" />
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="420" height="525" rx="6" fill="url(#bgGrad)" stroke="#272D3B" stroke-width="1.5" />

  <!-- Subtle ambient inner glow -->
  <circle cx="210" cy="180" r="140" fill="#242B38" opacity="0.4" filter="blur(40px)" />

  <!-- Natural human portrait silhouette -->
  <!-- Head -->
  <circle cx="210" cy="195" r="68" fill="url(#figureGrad)" stroke="#384152" stroke-width="1" />
  
  <!-- Shoulders / Torso -->
  <path d="M100 395 C100 295, 145 270, 210 270 C275 270, 320 295, 320 395 Z" fill="url(#figureGrad)" stroke="#384152" stroke-width="1" />

  <!-- Soft vignette baseline -->
  <rect x="0" y="420" width="420" height="105" rx="6" fill="url(#bgGrad)" opacity="0.9" />

  <!-- Quiet label -->
  <text x="210" y="460" fill="#94A3B8" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="500" letter-spacing="1" text-anchor="middle">Andres Provero</text>
  <text x="210" y="482" fill="#64748B" font-family="'Inter', -apple-system, sans-serif" font-size="11" letter-spacing="0.5" text-anchor="middle">Mexico City</text>
</svg>